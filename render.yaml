services:
  - type: web
    name: freshway-water-pos-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false
